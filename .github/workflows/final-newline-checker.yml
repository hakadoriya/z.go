name: final-newline-checker

on:
  pull_request:
    # NO paths filter

jobs:
  final-newline-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: hakadoriya-actions/final-newline-checker@v0.0.3
        id: final-newline-checker
        with:
          # NOTE: If you want to fail on missing final newline, set this to true
          #fail-on-missing: true
          # NOTE: If you want to check specific files, add regex patterns to paths
          #paths: |-
          #  ^action.yml
          #  ^missing-final-newline.md
          # NOTE: If you want to ignore specific files, add regex patterns to paths-ignore
          paths-ignore: |-
            .*\.gif$
            .*\.ico$
            .*\.jpe?g$
            .*\.png$
            .*\.svg$
            .*\.webp$
